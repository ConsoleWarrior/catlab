<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Котолаборатория — прототип рендера</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
      justify-content: center; align-items: center;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
    }
    #ui button {
      font-size: 15px; padding: 10px 16px; border: none; border-radius: 12px;
      background: #ff9eb5; color: #fff; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); touch-action: manipulation;
    }
    #ui button:active { transform: scale(0.96); }
    #ui button.secondary { background: #9ec5ff; }
    #ui button.warn { background: #ffc56e; }
    #fps {
      position: fixed; top: 8px; right: 10px;
      font-size: 14px; font-weight: 700; color: #444;
      background: rgba(255,255,255,0.7); padding: 4px 10px; border-radius: 10px;
    }
    #info {
      position: fixed; top: 8px; left: 10px; max-width: 60vw;
      font-size: 13px; color: #333; line-height: 1.4;
      background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="fps">FPS: –</div>
  <div id="info"></div>
  <div id="ui">
    <button id="btn-pair" class="secondary">Новая пара</button>
    <button id="btn-breed">Скрестить 🐾</button>
    <button id="btn-stress" class="warn">Стресс-тест: 200 котов</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
