<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Котолаборатория</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #fdf3e7; }
    #app { position: fixed; inset: 0; touch-action: none; }
    /* подсказка повернуть устройство (игра горизонтальная) */
    #rotate {
      position: fixed; inset: 0; display: none; z-index: 10;
      flex-direction: column; align-items: center; justify-content: center;
      background: #fdf3e7; color: #5a4a42; gap: 14px; text-align: center; padding: 24px;
    }
    #rotate .emoji { font-size: 56px; }
    #rotate p { font-size: 18px; font-weight: 600; }
    @media (orientation: portrait) and (max-width: 820px) {
      #app { display: none; }
      #rotate { display: flex; }
    }
    /* кнопка «во весь экран» (оверлей поверх canvas, для оценки UI без адресной строки) */
    #fs {
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 38px; height: 38px; border: none; border-radius: 10px;
      background: rgba(90,74,66,.42); color: #fff; font-size: 18px; line-height: 1;
      cursor: pointer; opacity: .75; -webkit-tap-highlight-color: transparent;
    }
    #fs:active { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <button id="fs" title="Во весь экран" aria-label="Во весь экран">⛶</button>
  <div id="rotate">
    <div class="emoji">🐱🔄</div>
    <p>Поверни телефон горизонтально</p>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('fs');
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!req) { btn.style.display = 'none'; return; } // iPhone Safari не умеет — прячем
      btn.addEventListener('click', function () {
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        if (fsEl) { exit.call(document); } else { req.call(root).catch(function () {}); }
      });
      function sync() {
        var on = document.fullscreenElement || document.webkitFullscreenElement;
        btn.textContent = on ? '✕' : '⛶';
      }
      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
